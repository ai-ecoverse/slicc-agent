name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    concurrency:
      group: release-tag
      cancel-in-progress: false
    env:
      LEFTHOOK: '0'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - id: head
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ] || git tag --points-at HEAD | grep -q '^v'; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "main has moved past $(git rev-parse --short HEAD); the run for the newer commit releases it" >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - if: steps.head.outputs.current == 'true'
        run: npm ci --ignore-scripts

      - if: steps.head.outputs.current == 'true'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        if: always() && steps.head.outputs.current == 'true'
        run: |
          set -euo pipefail
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$tag" ]; then
            git ls-remote --exit-code origin "refs/tags/$tag" > /dev/null || git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    if: always() && github.ref == 'refs/heads/main' && needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEFTHOOK: '0'
      TAG: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Publish the tag to npm, and fail unless publish.mjs printed its verdict
        run: |
          set -o pipefail
          node scripts/publish.mjs | tee "$RUNNER_TEMP/publish.log"
          grep -q '^publish: PASS' "$RUNNER_TEMP/publish.log" || { echo "::error title=publish::no PASS verdict from publish.mjs; its silence is not a pass"; exit 1; }

  verify:
    name: release / verify on npm
    needs: [tag, publish]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.tag.outputs.tag != '' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      LEFTHOOK: '0'
    permissions:
      contents: write
      issues: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/cert-review/gh.sh

      - name: The tag on npm is the tarball release.yml built from the tag on main, and its notes carry the certified or verified line
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: node tools/cert-review/verify.mjs --repo "$GITHUB_REPOSITORY" --version "${TAG#v}" --run "$GITHUB_RUN_ID" --wait 3600
