name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write
  statuses: write
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ai-ecoverse/slicc-shared-web/.github/workflows/pipeline.yml@v2.12.1
    secrets: inherit
    with:
      test: TEST_CONCURRENCY=4 npm test
      test-glob: test/integration/*.test.mjs
      shards: 4
      timeout-minutes: 30
      review-timeout-minutes: 90
      review-renovate: |
        patched-dependencies
      review-prompt: |
        SLICC-AGENT

        This repository is slicc-agent (`@ai-ecoverse/slicc-agent`): SLICC's agent core on pi durable. Seven (seven.sliccy.ai) loads its `dist/` unbundled from OPFS, through slicc-bios, and runs it in an agent worker next to slicc-kernel: the cone and its scoops, sessions in SQLite, remoting between tabs and devices, guests and their approvals, licks, workflows, skills, the providers and the vault. AGENTS.md and the README are the contract: read the sections the change touches first. `git diff origin/main...HEAD`, or `$RUNNER_TEMP/review/context/pr.diff`, is the change.

        There is no certification after you: once this pull request passes the merge queue, semantic-release publishes it to npm from `main`, and slicc-bios pins that release. Review it as the last check before it ships.

        Look for real defects, in this order:
        1. Security: the guest tool gate and its taint (seats, tiers, kernel taint tags, licks), approvals and sudo, remoting and device pairing, and secrets (vault values, provider keys, tokens) that must never reach a model, a guest, the transcript, a lick, an error or the console.
        2. Data loss or corruption: sessions and their SQLite documents, durable resume after a reload or a restart, rewinds and forks, and the files the agent writes in the kernel.
        3. Correctness: races between tabs, workers and the Web Lock, promises that resolve late or never, cancellation and Stop, providers against their APIs and CORS, and what the README says.
        4. Compatibility for consumers: the public entries (`.`, `./spectrum`, `./page`, `./agent-worker`) and their types change only additively, `files` ships everything the entries load, the kernel and slicc-spectrum peer ranges hold, and a 5.x agent still talks to this one.
        5. Patches: every patch to a dependency is listed in `patches/patches.json`; nothing is sent upstream.
        6. Tests: every behaviour change has an integration test in `test/integration/` through a public surface (the page, the spectrum adapter, the CLI, the kernel API), on pi's faux provider, never a real model, and a fix's test fails without the fix. Confirm that for a fix: copy the changed test files into `$RUNNER_TEMP/base`, build it and run them there.
        7. Repo rules: no comments anywhere (YAML too, except `# renovate:` annotations), no unit tests in git, and a conventional-commit title (`fix`, `feat` and `perf` release, the rest don't).

        Run `npm test` in a tree to build it and run its suite, or build with `npm run build && node test/integration/build.mjs` and run one file with `node --test --test-timeout=120000 --test-global-setup=node_modules/@ai-ecoverse/slicc-shared-web/harness/global.mjs test/integration/<file>.test.mjs`. The review browsers aren't used by this repository. Don't report style preferences, or anything you haven't confirmed in the code or by a run.

        Severity: deny for a confirmed P1 or P2: a guard bypass or a secret exposure, data loss or corruption, a crash or an agent that doesn't start in seven, a regression in a common workflow without a workaround, a behaviour change without its test, or a fix whose test passes without it. A narrow problem with a workaround is P3: comment with a repro and approve. A problem in the kernel belongs to ai-ecoverse/slicc-kernel, one in seven's pins to ai-ecoverse/slicc-bios, one in the UI to ai-ecoverse/slicc-spectrum: open it there as an issue.
