<!doctype html>
<meta charset="utf-8">
<script type="importmap">
{ "imports": { "@ai-ecoverse/slicc-scrub": "./slicc-scrub.mjs" } }
</script>
<script type="module">
import { serveVault } from './fake-vault.mjs';
import { seeded } from './seeds.mjs';

const { values } = seeded(await (await fetch('./vectors.json')).json());
addEventListener('message', ({ data, ports, source }) => {
  if (data?.role !== 'agent' || !ports[0]) return;
  window.vault = serveVault(ports[0], values);
  source.postMessage({ ready: true, pair: window.vault.pair }, '*');
});
parent.postMessage({ loaded: true }, '*');
</script>
